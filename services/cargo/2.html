<script>
$(document).ready(function(){
	load_data();
	function load_data(query)
	{
		$.ajax({
			url:"fetch_search.php",
			method:"post",
			data:{query:query},
			success:function(data)
			{
				$('#result_search').html(data);
			}
		});
	}
	
	$('#search_text').keyup(function(){

		$("#result_search").show();
		var search = $(this).val();
		if(search != '')
		{
			load_data(search);
		}
		else
		{
			load_data();			
		}
	});
});
$( "#body" ).click(function() {
 $( "#result_search" ).hide();
});
</script>
