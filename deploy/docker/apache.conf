<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Baseline hardening headers (TLS/HSTS usually terminated at the edge)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Tessera SaaS module paths
    Alias /tickets /var/www/html/tickets
    Alias /cargo /var/www/html/cargo
    Alias /accounts /var/www/html/accounts
    Alias /control /var/www/html/control
    Alias /settings /var/www/html/settings
    Alias /login /var/www/html/login

    <Directory /var/www/html/tickets>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php home.php
    </Directory>
    <Directory /var/www/html/cargo>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php home.php
    </Directory>
    <Directory /var/www/html/accounts>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <Directory /var/www/html/control>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <Directory /var/www/html/settings>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <Directory /var/www/html/login>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Legacy path redirects (old XAMPP / zip layout) → Tessera paths
    RewriteEngine On
    # Wave I6: Control console root → /control/ (absolute https — avoid :8080 internal port)
    RewriteCond %{HTTP_HOST} ^console\.tessera\.co\.tz$ [NC]
    RewriteRule ^/?$ https://console.tessera.co.tz/control/ [R=302,L]
    RewriteRule ^/?ticket/?$ https://%{HTTP_HOST}/tickets/ [R=301,L]
    RewriteRule ^/?ticket/(.*)$ https://%{HTTP_HOST}/tickets/$1 [R=301,L]
    RewriteRule ^/?account_up/?$ https://%{HTTP_HOST}/accounts/ [R=301,L]
    RewriteRule ^/?account_up/(.*)$ https://%{HTTP_HOST}/accounts/$1 [R=301,L]

    # Branded application-state HTTP pages
    ErrorDocument 400 /errors/status.php?code=400
    ErrorDocument 401 /errors/status.php?code=401
    ErrorDocument 403 /errors/status.php?code=403
    ErrorDocument 404 /errors/status.php?code=404
    ErrorDocument 405 /errors/status.php?code=405
    ErrorDocument 408 /errors/status.php?code=408
    ErrorDocument 409 /errors/status.php?code=409
    ErrorDocument 410 /errors/status.php?code=410
    ErrorDocument 413 /errors/status.php?code=413
    ErrorDocument 415 /errors/status.php?code=415
    ErrorDocument 422 /errors/status.php?code=422
    ErrorDocument 429 /errors/status.php?code=429
    ErrorDocument 500 /errors/status.php?code=500
    ErrorDocument 502 /errors/status.php?code=502
    ErrorDocument 503 /errors/status.php?code=503
    ErrorDocument 504 /errors/status.php?code=504

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
